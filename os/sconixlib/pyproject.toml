[project]
name = "sconixlib"
version = "0.1.0"
description = "Shared research primitives for Sconix Research OS"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pandas>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sconixlib"]
