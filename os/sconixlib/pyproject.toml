[project]
name = "sconixlib"
version = "0.1.0"
description = "Shared research primitives for Sconix Research OS"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pandas>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sconixlib"]
